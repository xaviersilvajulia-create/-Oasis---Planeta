<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OASIS // Eco-Pet Simulator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="vr-hud">
    <header class="hud-header">
      <h1 class="glitch">OASIS // ECO-AVATAR</h1>
      <p class="subtitle">SIMULADOR DE MANTENIMENTO PLANETÁRIO</p>
    </header>

    <!-- Estado do Avatar / Planeta Holográfico -->
    <div class="pet-display">
      <div id="planet-avatar" class="planet-core mood-healthy">
        <div class="planet-ring"></div>
      </div>
      <div id="planet-status-text" class="status-badge">ESTADO: SAUDÁVEL</div>
    </div>

    <!-- Barras de Status em Tempo Real -->
    <div class="status-container">
      <div class="status-box">
        <span class="status-label">SAÚDE AMBIENTAL</span>
        <div class="bar-outer"><div id="health-bar" class="bar-inner health" style="width: 80%;"></div></div>
        <span id="health-val" class="status-val">80%</span>
      </div>
      <div class="status-box">
        <span class="status-label">ENERGIA DO DIA</span>
        <div class="bar-outer"><div id="energy-bar" class="bar-inner energy" style="width: 100%;"></div></div>
        <span id="energy-val" class="status-val">100%</span>
      </div>
    </div>

    <!-- Painel de Ações Interativas -->
    <main class="hud-card">
      <h2 class="section-title">PAINEL DE AÇÕES DIÁRIAS</h2>
      <p class="instruction">Escolha ações para cuidar do seu ecossistema antes que a energia esgote:</p>

      <div class="actions-grid">
        <button class="btn-oasis" onclick="executarAcao('reciclar')">
          <span class="btn-icon">♻️</span>
          <div class="btn-info">
            <strong>Reciclar Lixo</strong>
            <small>+15% Saúde | -20% Energia</small>
          </div>
        </button>

        <button class="btn-oasis" onclick="executarAcao('arvore')">
          <span class="btn-icon">🌳</span>
          <div class="btn-info">
            <strong>Plantar Árvore Virtual</strong>
            <small>+25% Saúde | -35% Energia</small>
          </div>
        </button>

        <button class="btn-oasis" onclick="executarAcao('fastfood')">
          <span class="btn-icon">🍔</span>
          <div class="btn-info">
            <strong>Comprar Fast-Food</strong>
            <small>-20% Saúde | -10% Energia</small>
          </div>
        </button>

        <button class="btn-oasis" onclick="executarAcao('carro')">
          <span class="btn-icon">🚗</span>
          <div class="btn-info">
            <strong>Viagem de Carro</strong>
            <small>-30% Saúde | -15% Energia</small>
          </div>
        </button>
      </div>

      <div class="control-footer">
        <button class="btn-reset" onclick="passarDia()">🌙 AVANÇAR PARA O PRÓXIMO DIA</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
