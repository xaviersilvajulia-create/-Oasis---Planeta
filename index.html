<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OASIS // Protocolo Planeta</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="vr-hud">
    <header class="hud-header">
      <h1 class="glitch" data-text="OASIS // SIMULAÇÃO">OASIS // SIMULAÇÃO</h1>
      <p class="subtitle">SUAS ESCOLHAS MOLDAM O FUTURO DO PLANETA</p>
    </header>

    <div class="status-container">
      <div class="status-box">
        <span class="status-label">SAÚDE DO PLANETA</span>
        <div class="bar-outer"><div id="planet-bar" class="bar-inner planet" style="width: 100%;"></div></div>
        <span id="planet-val" class="status-val">100%</span>
      </div>
      <div class="status-box">
        <span class="status-label">CONFORTO PESSOAL</span>
        <div class="bar-outer"><div id="comfort-bar" class="bar-inner comfort" style="width: 100%;"></div></div>
        <span id="comfort-val" class="status-val">100%</span>
      </div>
    </div>

    <main id="game-card" class="hud-card">
      <h2 id="card-time" class="time-tag">07:00 AM // PRIMEIRO DILEMA</h2>
      <p id="card-text" class="question-text">Você acaba de acordar para ir à escola. Qual é a sua primeira atitude do dia?</p>
      
      <div class="options-container">
        <button class="btn-oasis" onclick="escolher(0)">
          <span class="btn-code">OPT_A</span>
          <span id="optA-text">Banho rápido de 5 minutos para economizar água.</span>
        </button>
        <button class="btn-oasis" onclick="escolher(1)">
          <span class="btn-code">OPT_B</span>
          <span id="optB-text">Banho longo de 20 minutos bem quente para relaxar.</span>
        </button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
