<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OASIS // Sobrevivência Pós-Apocalíptica</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="vr-overlay">
    <div class="login-card">
      <h1 class="glitch">OASIS // SOBREVIVÊNCIA</h1>
      <p class="subtitle">ZONA EM RUÍNAS - ANO 2088</p>
      <div class="input-group">
        <label for="player-name-input">NOME DO SOBREVIVENTE:</label>
        <input type="text" id="player-name-input" placeholder="Ex: Parzival" maxlength="15">
        <button class="btn-oasis" onclick="iniciarJogo()">ENTRAR NA ZONA</button>
      </div>
    </div>
  </div>

  <!-- TELA DE GAME OVER -->
  <div id="game-over-screen" class="vr-overlay" style="display: none;">
    <div class="login-card danger-card">
      <h1 class="glitch-danger">EXPECTATIVA DE VIDA ZERADA</h1>
      <p class="subtitle">O seu tempo no território pós-apocalíptico acabou.</p>
      <button class="btn-oasis" onclick="reiniciarJogo()">TENTAR NOVAMENTE</button>
    </div>
  </div>

  <!-- INTERFACE DO JOGO (HUD EXPANDIDA) -->
  <div id="game-ui" style="display: none;">
    <header class="hud-top">
      <div class="stat-badge">SOBREVIVENTE: <span id="display-player-name">---</span></div>
      <div class="stat-badge danger">EXPECTATIVA DE VIDA: <span id="life-span">40 Anos</span></div>
      <div class="stat-badge warning">SUPRIMENTOS: <span id="supplies-val">70%</span></div>
      <div id="status-safe" class="stat-badge safe" style="display: none;">[ESCONDERIJO SEGURO]</div>
    </header>

    <!-- MINIMAPA CONTAINER (CANTO SUPERIOR DIREITO) -->
    <div class="minimap-wrapper">
      <canvas id="minimapCanvas" width="120" height="120"></canvas>
    </div>

    <!-- NOTIFICAÇÃO DE ITEM -->
    <div id="item-popup" class="item-popup" style="display: none;"></div>

    <!-- PROMPTS DE INTERAÇÃO -->
    <div id="interaction-prompt" class="prompt-box" style="display: none;">
      Pressione <span class="key-highlight">[E]</span> para interagir
    </div>

    <!-- CAIXA DE DIÁLOGO E DECISÃO -->
    <div id="dialog-box" class="dialog-card" style="display: none;">
      <h3 id="npc-name" class="npc-title">Sobrevivente</h3>
      <p id="npc-text" class="npc-message">...</p>
      <div id="dialog-options" class="options-grid"></div>
    </div>
  </div>

  <!-- CANVAS PRINCIPAL -->
  <canvas id="gameCanvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
