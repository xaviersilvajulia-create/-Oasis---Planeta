<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OASIS // RPG Ecológico</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="vr-hud">
    <header class="hud-header">
      <h1 class="glitch">OASIS // CONEXÃO</h1>
      <p class="subtitle">REGISTO DE NOVO JOGADOR</p>
    </header>
    <div class="login-box">
      <label for="player-name-input" class="login-label">DIGITA O TEU NICKNAME:</label>
      <input type="text" id="player-name-input" placeholder="Ex: Parzival, Art3mis..." maxlength="15">
      <button class="btn-oasis btn-start" onclick="iniciarJogo()">ENTRAR NO OASIS</button>
    </div>
  </div>

  <!-- INTERFACE PRINCIPAL DO JOGO -->
  <div id="game-screen" class="vr-hud" style="display: none;">
    <header class="hud-header">
      <h1 class="glitch">OASIS // CIDADE VIVA</h1>
      <p class="subtitle">JOGADOR: <span id="display-player-name" class="player-highlight">---</span> | SAÚDE DA CIDADE: <span id="health-val">100%</span></p>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="600" height="400"></canvas>
      <div id="interaction-prompt" class="prompt-box" style="display: none;">
        Pressiona <span class="key-highlight">[E]</span> ou <span class="key-highlight">[ESPAÇO]</span> para conversar
      </div>
    </div>

    <!-- CAIXA DE DIÁLOGO -->
    <div id="dialog-box" class="dialog-card" style="display: none;">
      <h3 id="npc-name" class="npc-title">Cidadão</h3>
      <p id="npc-text" class="npc-message">...</p>
      <div id="dialog-options" class="options-grid"></div>
    </div>

    <div class="touch-controls">
      <p class="control-hint">Usa as teclas <span class="key-highlight">W, A, S, D</span> ou as <span class="key-highlight">Setas</span> para te moveres.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
